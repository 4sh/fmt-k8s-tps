apiVersion: apps/v1
kind: Deployment
metadata:
  name: list-pod-deployment
  namespace: tp3
spec:
    replicas: 1
    selector:
        matchLabels:
          test: list-pod
    template:
        metadata:
          labels:
              test: list-pod
        spec:
          containers:
              - name: list-pod
                image: alpine/kubectl:1.35.0
                command:
                  - "/bin/sh"
                  - "-c"
                  - "kubectl get pods -n tp3; sleep 600"