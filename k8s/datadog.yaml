kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    clusterName: "test"
    site: "datadoghq.eu"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
    registry: "eu.gcr.io/datadoghq"
    tags:
      - "env:$ME"
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
